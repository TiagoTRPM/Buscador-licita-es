<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Radar de Licitações - PNCP{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/" class="header-logo">🏛️ Agregador de Licitações</a>
